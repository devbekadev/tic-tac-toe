<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" />
    <title>Tic Tac Toe — Play a round</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game" aria-labelledby="game-title">
      <header class="game-header">
        <p class="eyebrow">THE CLASSIC GAME</p>
        <h1 id="game-title">Tic <span>tac</span> toe</h1>
        <p class="subtitle">A little friendly competition.</p>
      </header>

      <section class="scoreboard" aria-label="Scoreboard">
        <div class="player-card is-active" id="player-x-card">
          <span class="player-mark mark-x" aria-hidden="true">×</span>
          <span class="player-name">Player X</span>
          <strong class="player-score" id="score-x">0</strong>
        </div>
        <div class="score-divider" aria-hidden="true">:</div>
        <div class="player-card" id="player-o-card">
          <span class="player-mark mark-o" aria-hidden="true">○</span>
          <span class="player-name">Player O</span>
          <strong class="player-score" id="score-o">0</strong>
        </div>
      </section>

      <section class="play-area" aria-label="Game">
        <p class="game-status" id="game-status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-message">Player X's turn</span>
        </p>
        <div class="board" id="board" role="group" aria-label="Tic tac toe board">
          <button class="cell" type="button" data-cell="0" aria-label="Row 1, column 1, empty"></button>
          <button class="cell" type="button" data-cell="1" aria-label="Row 1, column 2, empty"></button>
          <button class="cell" type="button" data-cell="2" aria-label="Row 1, column 3, empty"></button>
          <button class="cell" type="button" data-cell="3" aria-label="Row 2, column 1, empty"></button>
          <button class="cell" type="button" data-cell="4" aria-label="Row 2, column 2, empty"></button>
          <button class="cell" type="button" data-cell="5" aria-label="Row 2, column 3, empty"></button>
          <button class="cell" type="button" data-cell="6" aria-label="Row 3, column 1, empty"></button>
          <button class="cell" type="button" data-cell="7" aria-label="Row 3, column 2, empty"></button>
          <button class="cell" type="button" data-cell="8" aria-label="Row 3, column 3, empty"></button>
        </div>
      </section>

      <div class="game-actions">
        <button class="button button-primary" id="new-game" type="button">New round</button>
        <button class="button button-secondary" id="reset-scores" type="button">Reset scores</button>
      </div>
      <p class="hint">Take turns placing your mark. Three in a row wins.</p>
    </main>
  </body>
</html>
